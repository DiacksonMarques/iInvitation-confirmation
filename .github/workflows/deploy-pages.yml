name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          BUILD_DIR=$(find dist -type d -name browser -print -quit)

          if [ -z "$BUILD_DIR" ]; then
            BUILD_DIR=$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)
          fi

          echo "Build directory: $BUILD_DIR"

          mkdir -p _site
          cp -R "$BUILD_DIR"/. _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
